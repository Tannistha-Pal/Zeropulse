services:
  postgres:
    image: postgres:16
    container_name: zeropulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeropulse_user
      POSTGRES_PASSWORD: zeropulse_password
      POSTGRES_DB: zeropulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: zeropulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: